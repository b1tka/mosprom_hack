- id: day3_1730
  title: "Третий рабочий день, 17:30: опрос"
  at: {rel: start, workday: 2, time: "17:30"}
  survey: day3
  nodes:
    - say: "Первые пару дней на новом месте могут быть немного сложными, поэтому мы предлагаем пройти тебе опрос, чтобы поделиться с нами своими впечатлениями!"
    - ask:
        id: q1
        kind: choice
        text: "Вопрос 1: Были ли вопросы при оформлении?"
        options:
          - {key: a, label: "Все отлично!"}
          - key: b
            label: "Остались вопросы"
            do:
              - say:
                  text: "Хорошо, я тебя понял! Помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы."
                  buttons: [contact_hr]
          - key: c
            label: "Возникли трудности с документами"
            negative: true
            do:
              - say:
                  text: "Очень важно иметь возможность полноценно изучить подписываемые документы. Я буду благодарен, если ты поделишься с нами, почему у тебя не получилось этого сделать. В чем заключалась проблема?"
                  buttons: [report_problem, contact_hr]
    - ask:
        id: q2
        kind: choice
        text: "Вопрос 2: Как тебя встретили новые коллеги?"
        options:
          - {key: a, label: "Отлично!"}
          - {key: b, label: "Пока присматриваюсь"}
          - key: c
            label: "Никак, все заняты"
            negative: true
            do:
              - say:
                  text: "Жалко, что не удалось познакомиться с новыми коллегами. Скорее всего, ты вышел на работу в период большой нагрузки, такое бывает. Но если тебе кажется, что что-то пошло не так, то не бойся поднять этот вопрос со своим руководителем или написать моим коллегам в HR. Мы всегда готовы помочь."
                  buttons:
                    - {action: report_problem, label: "Передать проблему в HR"}
                    - {action: contact_hr, label: "Связаться с HR"}
    - ask:
        id: q3
        kind: choice
        text: "Вопрос 3: Понятны ли тебе задачи на испытательный срок?"
        options:
          - {key: a, label: "Да, все понятно!", do: [{say: "Отлично 💪🏻"}]}
          - key: b
            label: "Жду разъяснений от руководителя"
            do:
              - say:
                  text: "Хорошо. Если в ближайшее время ты не получишь разъяснения по своим задачам, то лучше всего будет напрямую обсудить этот вопрос с руководителем. Также помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы. Мы всегда готовы помочь."
                  buttons: [contact_hr]
          - key: c
            label: "Пока ничего не понял"
            negative: true
            do:
              - say:
                  text: "Понимание своих задач на испытательном сроке - ключевой элемент его успешного прохождения. Если у тебя нет четкого представления, в чем будет заключаться твоя работа на ближайшие три месяца, то лучше всего обсудить этот вопрос с руководителем. Если недопонимание так и не прояснилось после общения с руководителем, то ты всегда можешь написать моим коллегам в отдел подбора персонала."
                  buttons: [report_problem, contact_hr]
    - say: |-
        Спасибо за обратную связь!
        Увидимся завтра 👋🏻

