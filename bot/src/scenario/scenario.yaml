          - {key: clear, label: "Более четкие задачи"}
          - {key: auto, label: "Автоматизация процессов"}
          - {key: help, label: "Помощь коллег"}
    - ask:
        id: q3
        kind: choice
        tags: [GTP]
        text: "3) Что помогло бы ускорить твою адаптацию?"
        other: "Свой вариант"
        options:
          - {key: clear, label: "Более четкие задачи"}
          - {key: auto, label: "Автоматизация процессов"}
          - {key: help, label: "Помощь коллег"}
    - say: "Спасибо за обратную связь!"
    - say:
        when: {q1: b}
        text: "Очень жаль, что работа не приносит тебе удовольствие. Если я и мои коллеги можем помочь тебе чем-то, направь вопрос в отдел подбора персонала. Мы вместе постараемся придумать решение и сделать твою жизнь на работе комфортнее."
        buttons: [report_problem, contact_hr]
    - say:
        when: {q1: c}
        text: "Мы все иногда можем сталкиваться с большим объемом работы, короткими сроками или слишком высокими ожиданиями со стороны руководства и коллег. Все это может создать большое давление и привести к отрицательным последствиям для физического и эмоционального здоровья. 😞\nСостояние эмоционального напряжения не является нормой, и в таком случае я бы рекомендовал обратиться в отдел подбора персонала: описать свою проблему, чтобы мы вместе придумали, как исправить ситуацию и сделать твою жизнь на работе комфортнее."
        buttons: [report_problem, contact_hr]
    - say:
        when: {q2: nobody}
        text: "Поддержка - важная составляющая успешной адаптации. Я всегда готов помочь тебе! Но какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. В таких случаях ты всегда можешь обратиться за помощью к рекрутеру."
        buttons: [report_problem, contact_hr]

# ------------------------------------------------------------------ ТРЕТИЙ МЕСЯЦ
- id: month3_start
  title: "Первый день третьего месяца: финишная прямая"
  at: {rel: start, months: 2, time: "09:00"}
  nodes:
    - say:
        img: 9
        slot: quote
        text: |-
          Привет, {name}!
          Я давно тебе не писал, не хотел отвлекать от работы. Но не мог пропустить такую знаковую дату!

          Ты уже на финишной прямой, совсем скоро закончится твой испытательный срок.

- id: m2w2_books
  title: "Через 2 месяца и 2 недели: подборка книг (офис)"
  at: {rel: start, months: 2, days: 14, time: "10:00"}
  office: true
  nodes:
    - say: |-
        Привет, {name}!
        Пока мы не виделись, я собрал для тебя еще одну подборку. На этот раз - книги для саморазвития и карьерного роста. Надеюсь, что-то из списка приглянется 😉

        🔸 «Ты способна на большее. 12 привычек, которые мешают женщинам сделать карьеру", Маршалл Голдсмит, Салли Хелгесен
        Авторы описывают 12 привычек, которые мешают исключительно женщинам в их желании сделать карьеру. Книга поможет определить причины «пробуксовки», изменить свое поведение и выйти на новый профессиональный уровень.

        🔹 «Найти свое призвание», Кен Робинсон
        Книга помогает понять разницу между работой в режиме "надо" и работой, для которой ты был рожден. Даны конкретные инструменты самопознания, которые помогают разобраться в себе.

        🔸 «Кради как художник», Остин Клеон
        Книга вдохновляет тогда, когда наступает кризис идей. Чтобы нарисовать свою картину, нужно перерисовать сначала сотню копий.

        🔹 «Между надо и хочу», Эль Луна
        Если вы находитесь сейчас на распутье, вам обязательно нужно прочитать эту книгу! Этакая книга-собеседник. Шаги предельно понятны: нужно изучить свои "надо", понять, чего "хочу", и действовать.

        🔸 «Предназначение», Александр Рей
        Книга-тренинг с пошаговой инструкцией, что нужно сделать, чтобы найти свое предназначение. Много философских высказываний, которые запоминаешь надолго.

        🔹 «Работа твоей мечты», Барбара Шер
        Сборник советов и идей по тому, как правильно подобрать работу мечты. Некоторые из них чуть наивны. Помогает выйти за рамки стандартного понимания карьеры.

        🔸 «Работа», Байрон Кейти
        Книга-путеводитель для работы над собой. Если технику 4 вопросов выполнить честно, результат не заставит себя ждать.

        🔹 «Great work. Как найти вдохновение, полюбить свою работу и начать зарабатывать», Дэвид Стерт.
        Книга помогает понять, на что стоит тратить свое время для достижения успеха. Автор рассказывает о пяти практических навыках, которые помогут придумать новые идеи, инновационные подходы и делать такую работу, которую заметят и оценят.

        🔸 «Энергия – новая валюта. Как поддерживать баланс жизненных сил», Леонид Кроль
        Книга о том, как правильно распределять энергию. О том, как у разных людей разные источники наполнения. В книге много примеров и практических рекомендаций.
    - say: {slot: card2}

# ------------------------------------------------------------------ КОНЕЦ ИСПЫТАТЕЛЬНОГО СРОКА
- id: probation_end
  title: "Последний день испытательного срока: опрос и прощание"
  at: {rel: start, months: 3, days: -1, time: "09:00", weekend: prev}
  survey: probation
  nodes:
    - say:
        img: 10
        text: |-
          Дорогой {name},
          Эти 3 месяца пролетели так быстро! Ты только начинаешь познавать нашу компанию и вот, уже завершился твой адаптационный период...

          Пока эмоции все еще свежи, поделишься с нами своими впечатлениями от прохождения испытательного срока?
    - ask:
        id: q1
        kind: choice
        text: "Вопрос 1: Что было самым сложным в период адаптации?"
        other: "Другое"
        options:
          - {key: a, label: "Со всем справился"}
          - {key: b, label: "Коммуникации с другими отделами"}
          - {key: c, label: "Нечеткие задачи"}
    - ask:
        id: q2
        kind: choice
        text: "Вопрос 2: Планируешь ли ты продолжить работу по итогам испытательного срока?"
        mood: true
        options:
          - key: a
            label: "Да, однозначно!"
            do: [{say: "Мы рады видеть тебя в нашей команде и надеемся, что ты останешься с нами на долгое время! 🎉"}]
          - key: b
            label: "Не уверен"
            negative: true
            do:
              - text:
                  id: q2_reason
                  text: "Могу ли я поинтересоваться, в чем причина твоих сомнений по поводу нашей компании?"
                  optional_label: "Пропустить"
                  buttons:
                    - {action: contact_hr, label: "Готов озвучить причину в личной коммуникации с рекрутером"}
          - key: c
            label: "Нет, задумываюсь об уходе"
            negative: true
            do:
              - text:
                  id: q2_reason
                  text: "Очень жаль, что ты сомневаешься в дальнейшем сотрудничестве с нами. Могу ли я поинтересоваться, что на это повлияло?"
                  optional_label: "Пропустить"
                  buttons:
                    - {action: contact_hr, label: "Готов озвучить причину в личной коммуникации с рекрутером"}
    - scale: {id: s1, text: "1. Оцените уровень нагрузки по задачам (1 - очень некомфортная, 10 - полностью комфортная)", low: 8}
    - scale: {id: s2, text: "2. Насколько ваши ожидания от работы совпадают с реальностью (1 - разочаровали, 10 - превзошли ожидания)", low: 8}
    - ask: {id: s3, kind: yesno, text: "3. Вам достаточно информации для качественного выполнения вашей работы?", reason: true, options: [{key: yes, label: "Да"}, {key: no, label: "Нет", negative: true}]}
    - scale: {id: s4, text: "4. Насколько доступен ваш руководитель для вопросов и обратной связи? (1 - недоступен, 10 - всегда доступен)", low: 8}
    - scale: {id: s5, text: "5. Оцените качество обратной связи от руководителя. (1 - отсутствует, 10 - исчерпывающая)", low: 8}
    - scale: {id: s6, text: "6. Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе (1 - нет взаимодействия, 10 - отличное взаимодействие)", low: 8}
    - scale: {id: s7, text: "7. Как вы оцениваете ваше взаимодействие с другими подразделениями (1 - плохо, 10 - отличное взаимодействие)", low: 8}
    - scale: {id: s8, text: "8. Как вы оцениваете качество поддержки от HR по возникающим вопросам? (1 - низкое, 10 - очень высокое)", low: 8}
    - scale: {id: s9, text: "9. Насколько вам удалось реализовать поставленные на испытательный срок задачи (1 – совсем не удалось, 10 – удалось полностью)", low: 8}
    - text:
        id: q3
        text: "Вопрос 3: Что порекомендуешь улучшить для более комфортной адаптации сотрудника?"
        optional_label: "Пропустить"
        mood: true
    - say: "Спасибо! Мы обязательно учтем твои рекомендации 💙"
    - say: {format: markdown, text: "И напоследок кидаю тебе [плейлист](https://music.yandex.ru/artist/5631933?lang=en) для концентрации внимания! 🎶"}
    - ask:
        id: bye
        kind: choice
        img: 16
        text: |-
          Кажется, все вопросы заданы, а материалы переданы. Пришло время нам с тобой попрощаться на ближайшее время.

          Надеюсь, я немного ускорил процесс твоего погружения в нашу компанию и помог приспособиться к новой среде. Если в будущем тебе понадобится помощь, я думаю, ты уже знаешь, что всегда можешь обратиться к моим коллегам в HR.

          Наше с тобой общение подошло к концу, я был рад тебя сопровождать!
          До встречи, {name}! 👋🏻
        options:
          - {key: bye1, label: "Пока, Корсик! 💙", do: [{say: {slot: card_bye}}]}
          - {key: bye2, label: "😭😞😭😞🥺😞", do: [{say: {slot: card_bye}}]}
        timeout_h: 48
        default: bye1
