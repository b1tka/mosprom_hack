# Сценарий онбординга «Корсик» (источник: «Финал. ТЗ. Чат-бот Корсик- 15.09.xlsx», лист 27.02.2026).
# Правка текста/времени = правка этого файла + перезапуск бота (при ошибке в файле бот не стартует и пишет, что не так).
#
# Формат
#   at       когда запускать шаг:
#              {rel: activation, delay_min: N}                 сразу после активации QR (+N мин)
#              {rel: start, days: D, months: M, workday: W, time: "ЧЧ:ММ", weekend: next|prev|keep}
#                 start = дата выхода; workday: W-й рабочий день после выхода (0 = день выхода);
#                 days/months — календарное смещение; weekend: что делать, если дата выпала на выходной (по умолчанию next)
#   tags     шаг/узел только для этих тегов (GTP, GrPP, Luzhniki); office: true|false — только офис / только предприятие
#   survey   id опроса: его вопросы и ответы сохраняются, незавершённый опрос напоминает о себе
#   nodes    последовательность узлов шага; узел с вопросом останавливает цепочку до ответа
#     say    {text, img, slot, buttons, when, tags, office}   сообщение; img — номер картинки из assets/photos;
#            slot — необязательный файл assets/content/<slot>[.<тег>].<расширение> (нет файла — отправляется без него);
#            buttons — быстрые действия (contact_hr, report_problem) или {action, label}
#     ask    {id, kind: choice|yesno, text, img, options: [{key, label, do: [узлы], negative, mood}], timeout_h, default}
#     multi  {id, text, options: [{key, label, negative}], done_label}                    множественный выбор
#     scale  {id, text, min, max, low, reason}   шкала; ответ ниже low просит причину текстом
#     text   {id, text, img, forward, optional_label, buttons, photo}   ответ текстом (и фото); forward: hr — отправить HR
#     rag    {query, fallback}   ответ из базы знаний по фиксированному вопросу; fallback — если ответа нет
#     use    имя блока из blocks (общие куски, их же вызывают команды)
#     email  {subject, text}   письмо на почту сотрудника (нужен SMTP)
#   when     условие по ответам этого опроса: {id: ключ | [ключи]}

version: 1
utc_offset_min: 180          # Europe/Moscow
start_offset_days: 3         # дата выхода = дата QR + 3 дня (выходной -> следующий понедельник)
office_tags: [GrPP, Luzhniki]   # остальные теги — предприятие (GTP)
pause_ms: 1200               # пауза между сообщениями цепочки

actions:
  contact_hr: "Связаться с рекрутером"
  report_problem: "Передать проблему в отдел подбора персонала"

# Если сотрудник просто задал вопрос, на который бот не знает ответа (строка 69 ТЗ)
unknown_question:
  img: 13
  text: |-
    Какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. Я посоветуюсь с коллегами из подбора персонала и вернусь с ответом!
  buttons:
    - {action: report_problem, label: "Передать вопрос в отдел подбора персонала"}
    - contact_hr

# Если опрос не пройден за сутки: напомнить на завтра и послезавтра (строка 70 ТЗ)
survey_reminder:
  img: 12
  after_h: 24
  max: 2
  text: |-
    Привет, {name}!
    Пишу с небольшим напоминанием, что ты не прошел опрос.
    Пожалуйста, не забудь это сделать в ближайшее время.

    P.S.: Он займет всего 1-2 минуты!

# Вспомогательный текст, которого нет в ТЗ (шкалы и причины)
texts:
  scale_hint: "Выбери оценку от 1 до 10:"
  reason_prompt: "Спасибо за честность 🙏 Расскажи, пожалуйста, что именно не так? Напиши причину одним сообщением."
  report_problem_prompt: "Расскажи, что случилось, одним сообщением, и я передам это в отдел подбора персонала 🙏"
  report_problem_done: "Спасибо за откровенность 💙 Передал твоё сообщение в отдел подбора персонала, скоро с тобой свяжутся."
  contact_hr_done: "Готово! Ты в чате с HR 💬 Всё, что напишешь, получит специалист. Вернуться ко мне: /bot"
  experience_done: "Спасибо! 💙 Передал твой рассказ коллегам из HR, они обязательно представят тебя команде."
  no_hr: "Пока за тобой не закреплён HR-специалист 😕 Напиши, пожалуйста, в отдел кадров напрямую."

# Общие блоки, на которые ссылаются шаги и команды
blocks:
  food:   # /Food и ответ «Да» на «Хочешь, подскажу, где пообедать?»
    - say: {img: 5, slot: lunch, text: "Приятного аппетита!"}
  # Для ответов «Да» на предложения (транспорт, карты, зал) в ТЗ нет текста: ответ берётся из базы знаний (RAG),
  # а если там ничего нет — отправляется fallback и HR узнаёт об интересе. Файлы-карты — необязательные слоты assets/content/.
  transport_info:
    - rag:
        query: "Расскажи о корпоративном транспорте: маршруты и расписание"
        fallback: "Подробностей по маршрутам и расписанию у меня пока нет 😕 Но я уже передал HR, что тебе это интересно, он пришлёт всё нужное!"
  map_territory:
    - say: {slot: map_territory}
    - rag:
        query: "Расскажи о территории предприятия: корпуса, проходные, как ориентироваться"
        fallback: "Подробной карты территории у меня пока нет 😕 Но я уже передал HR, что тебе это интересно, он пришлёт её!"
  map_floors:
    - say: {slot: map_floors}
    - rag:
        query: "Расскажи о том, как устроен офис: этажи, где что находится"
        fallback: "Подробной карты этажей у меня пока нет 😕 Но я уже передал HR, что тебе это интересно, он пришлёт её!"
  gym_info:
    - rag:
        query: "Расскажи о спортивном комплексе на территории предприятия: расписание и оснащение"
        fallback: "Расписания и оснащения зала у меня пока нет 😕 Но я уже передал HR, что тебе это интересно, он пришлёт всё нужное!"

steps:

# ------------------------------------------------------------------ ДО ВЫХОДА
- id: pre_start
  title: "За 2-3 дня до выхода: знакомство"
  at: {rel: activation, delay_min: 0}
  nodes:
    # Текст строки 3 в ТЗ не дописан («Что умеет этот бот...») — составлен по списку возможностей
    - say:
        img: 14
        text: |-
          Что умеет этот бот? 🤖
          • рассказываю о компании и напоминаю, что подготовить к выходу на работу;
          • сопровождаю тебя первые три месяца: поздравляю, присылаю полезные материалы и короткие опросы;
          • отвечаю на вопросы о работе в компании: просто напиши мне в любой момент;
          • помогаю связаться с HR (команда /HR);
          • подсказываю, где пообедать (команда /Food).
    - say:
        img: 2
        text: |-
          Добро пожаловать в нашу команду!
          Привет-привет-привет! 🐾 Меня зовут Корсик, ваш персональный гид по миру Группы ПОЛИПЛАСТИК! 🤗

          Рад знакомству и обещаю сделать вашу адаптацию веселой, легкой и комфортной! 💃 Вместе мы изучим компанию и найдем друзей среди лучших специалистов отрасли. 🌟

          Готов делиться секретами успешной интеграции, отвечать на ваши вопросы и помогать адаптироваться в новом коллективе! 👍

          Давайте начнем путешествие навстречу большим профессиональным успехам и теплым отношениям! ✨

          Корсик
    - ask:
        id: address
        kind: choice
        text: "Как мы будем общаться?"
        options:
          - {key: ty, label: "На ТЫ"}
          - {key: vy, label: "На ВЫ"}
        timeout_h: 12
        default: ty
    - say: "Очень приятно с тобой познакомиться, {name}!"
    - say:
        img: 1
        text: |-
          Меня зовут Корсик, я помогу тебе быстро и легко адаптироваться на новом рабочем месте!

          В течение первых трех месяцев я буду сопровождать тебя в пути, предоставлять информацию о компании, которая поможет тебе лучше ориентироваться в рабочей среде.
    - say:
        tags: [GrPP, Luzhniki]
        img: 3
        text: |-
          Для того, чтобы ты пришел подготовленный в свой первый рабочий день, ознакомься со списком необходимых для оформления документов и подготовь их к своему выходу на работу.

          Необходимые документы для Вашего трудоустройства:
          1. Бумажная трудовая книжка и сведения о трудовой деятельности (можно выгрузить с сайта гос. услуг);
          2. Паспорт;
          3. СНИЛС;
          4. ИНН;
          5. Документ об образовании (диплом, свидетельства, удостоверения, допуски);
          6. Свидетельство о браке/разводе (в случае смены ФИО);
          7. Свидетельство о рождении ребенка (до 18 лет);
          8. Документы воинского учета.
    - say:
        tags: [GTP]
        img: 3
        text: |-
          Для того, чтобы ты пришел подготовленный в свой первый рабочий день, ознакомься со списком необходимых для оформления документов и подготовь их к своему выходу на работу.

          Необходимые документы для Вашего трудоустройства:
          1. Бумажная трудовая книжка и сведения о трудовой деятельности (можно выгрузить с сайта гос. услуг);
          2. Паспорт;
          3. СНИЛС;
          4. ИНН;
          5. Документ об образовании (диплом, свидетельства, удостоверения, допуски);
          6. Свидетельство о браке/разводе (в случае смены ФИО);
          7. Свидетельство о рождении ребенка (до 18 лет);
          8. Документы воинского учета.
          9. Фотографии 3*4 в количестве 2шт (Цвет/ЧБ)
    - ask:
        id: transport
        kind: yesno
        tags: [GrPP]
        text: "Чтобы дорога до офиса была комфортнее, у нас есть корпоративный транспорт! Рассказать о маршрутах и расписании?"
        options:
          - {key: yes, label: "Да", do: [{use: transport_info}]}
          - {key: no, label: "Нет", do: [{say: "Хорошо! Если понадобится, просто спроси меня 😉"}]}
    - ask:
        id: transport
        kind: yesno
        tags: [GTP]
        text: "Чтобы дорога до предприятия была комфортнее, у нас есть корпоративный транспорт! Рассказать о маршрутах и расписании?"
        options:
          - {key: yes, label: "Да", do: [{use: transport_info}]}
          - {key: no, label: "Нет", do: [{say: "Хорошо! Если понадобится, просто спроси меня 😉"}]}
    - ask:
        id: transport
        kind: yesno
        tags: [Luzhniki]
        text: "Чтобы ты легко спланировал свой маршрут в первый день, я собрал для тебя всю информацию о том, как добраться до офиса. Интересно?"
        options:
          - {key: yes, label: "Да", do: [{use: transport_info}]}
          - {key: no, label: "Нет", do: [{say: "Хорошо! Если понадобится, просто спроси меня 😉"}]}
    - say: |-
        Я готов поделиться самыми интересными фактами о своей организации.

        🧑🏼‍🔧 Факт №1: Я горжусь тем, что работаю в компании, которая делает мир лучше каждый день! Наши инновационные трубы помогают обеспечивать чистой водой миллионы людей по всей стране. А ещё, знаешь, какое наше самое гордое достижение? Наша продукция помогает экономить природные ресурсы благодаря долговечности и энергоэффективности. Представляешь, как круто создавать будущее экологически чистым способом?

        📚 Факт №2: Знаешь, какой секрет успешной карьеры в нашем дружном коллективе? Здесь ценят инициативу и поддерживают таланты! Все сотрудники имеют равные возможности развиваться профессионально и строить карьеру. Даже я иногда участвую в тренингах и семинарах — расширяю кругозор и делюсь знаниями с новичками.

        🛠️ Факт №3: Кстати, хочешь посмотреть мир и почувствовать себя настоящим путешественником? Группа «ПОЛИПЛАСТИК» имеет филиалы по всей России и странам СНГ, так что твоя карьера может легко превратиться в захватывающее приключение. Стартуя с одного города, можно переехать куда угодно и покорять вершины успеха в любой точке страны. Ммм... интересно, правда же?

        Присоединяйся к нашей большой команде, ведь здесь тебя ждут интересные проекты, поддержка коллег и большие перспективы!
    - say: |-
        Очень скоро мы начнем полноценное погружение в компанию, а пока отдыхай. Я напишу тебе за день до выхода на работу

        До встречи, {name}! 👋🏻

- id: day_before
  title: "За день до выхода"
  at: {rel: start, days: -1, time: "12:00", weekend: keep}
  nodes:
    - ask:
        id: ready
        kind: choice
        text: |-
          Привет, {name}! Уже завтра наступит твой первый рабочий день. Ты готов?
        options:
          - {key: ready1, label: "Да, жду не дождусь!", do: [{say: "Супер! Мне нравится твой настрой ✨"}]}
          - {key: ready2, label: "Готов/Готова", do: [{say: "Супер! Мне нравится твой настрой ✨"}]}
          - key: worried
            label: "Да, но немного волнуюсь"
            do:
              - say: |-
                  Это нормально - немного волноваться в твой первый рабочий день. Поверь мне, я сам через это все проходил, когда меня создавали 😓

                  Весь первый день мы проведем вместе, я тебе расскажу все самое важное о нашей компании и пришлю много полезной информации, чтобы твое погружение прошло как можно легче.
    - say:
        img: 3
        text: |-
          Для того, чтобы ты пришел подготовленный в свой первый рабочий день, напоминаю про список необходимых для оформления документов, подготовь их к своему выходу на работу.

          Необходимые документы для Вашего трудоустройства:
          1. Бумажная трудовая книжка и сведения о трудовой деятельности (можно выгрузить с сайта гос. услуг);
          2. Паспорт;
          3. СНИЛС;
          4. ИНН;
          5. Документ об образовании (диплом, свидетельства, удостоверения, допуски);
          6. Свидетельство о браке/разводе (в случае смены ФИО);
          7. Свидетельство о рождении ребенка (до 18 лет);
          8. Документы воинского учета.
          9. Фотографии 3*4 в количестве 2шт (Цвет/ЧБ)

# ------------------------------------------------------------------ ПЕРВЫЙ РАБОЧИЙ ДЕНЬ
- id: day1_10
  title: "Первый день, 10:00: поздравление и доступы"
  at: {rel: start, workday: 0, time: "10:00"}
  nodes:
    - say:
        img: 4
        text: |-
          Поздравляю с первым рабочим днем, {name}!  🥳

          Уверен, что ты будешь отлично справляться со своими задачами, вносить свой вклад в наше общее дело и делиться идеями. Мы всегда готовы поддержать тебя и создать комфортные условия для работы. Пожалуйста, не стесняйся, обращайся к коллегам из нашей команды, мы всегда открыты для общения.
    - email:
        subject: "Добро пожаловать в команду ПОЛИПЛАСТИК!"
        text: |-
          Здравствуйте, {name}!

          От лица всей команды поздравляем Вас с вступлением в наши ряды! Мы искренне рады видеть нового коллегу среди наших профессионалов и уверены, что ваше присоединение станет важным этапом в развитии компании.

          Прежде всего хотим выразить благодарность за доверие и выбор именно нашего коллектива. Впереди у вас много интересных проектов, профессиональных достижений и замечательных знакомств с новыми коллегами.

          Перед первым рабочим днем мы подготовили для вас важную информацию:

          - Вы получите доступ ко внутренней документации и необходимым сервисам для начала работы.
          - В течение первой рабочей недели мы познакомим вас с основными процессами, покажем рабочее пространство и представим коллектив.
          - Ваш непосредственный руководитель и куратор подробно расскажут обо всех аспектах вашей будущей деятельности.

          Желаем Вам успешного старта, увлекательной работы и вдохновляющих результатов! Уверены, впереди нас ждет многое, и ваша работа внесёт весомый вклад в развитие компании.

          Если возникнут любые вопросы или пожелания, пожалуйста, сообщайте нам сразу. Мы готовы поддержать вас на каждом этапе вашего пути.

          Добро пожаловать в нашу команду!

- id: day1_11_map_gtp
  title: "Первый день, 11:00: карта территории (предприятие)"
  at: {rel: start, workday: 0, time: "11:00"}
  tags: [GTP]
  nodes:
    - ask:
        id: map
        kind: yesno
        text: "Наша территория довольно большая, но я помогу тебе в ней разобраться! Хочешь, я покажу подробную карту?"
        options:
          - {key: yes, label: "Да", do: [{use: map_territory}]}
          - {key: no, label: "Нет", do: [{say: "Хорошо! Если понадобится, просто спроси меня 😉"}]}

- id: day1_11_map_office
  title: "Первый день, 11:00: карта этажей (Luzhniki)"
  at: {rel: start, workday: 0, time: "11:00"}
  tags: [Luzhniki]
  nodes:
    - ask:
        id: map
        kind: yesno
        text: "Наш офис довольно большой, но я помогу тебе в нем разобраться! Хочешь я покажу тебе подробную карту?"
        options:
          - {key: yes, label: "Да", do: [{use: map_floors}]}
          - {key: no, label: "Нет", do: [{say: "Хорошо! Если понадобится, просто спроси меня 😉"}]}

- id: day1_12
  title: "Первый день, 12:00: доступы и открытка"
  at: {rel: start, workday: 0, time: "12:00"}
  nodes:
    - ask:
        id: access
        kind: yesno
        tags: [GrPP, Luzhniki]
        text: |-
          Тебе предстоит многое узнать о нашей компании. Но сначала решим пару организационных вопросов.

          На твоем рабочем месте тебя будет ждать необходимая техника. Для тебя уже заведена учетная запись и доступы IT. Есть ли у тебя все необходимые доступы и материалы?
        options:
          - {key: yes, label: "Да, все есть", do: [{say: "Замечательно! Тогда пока осваивайся, а я напишу тебе чуть позже."}]}
          - key: no
            label: "Нет"
            negative: true
            do:
              - say: "Ничего страшного! В таком случае лучше всего уточнить у твоего руководителя, когда будут заведены доступы и предоставлены необходимые материалы."
    - ask:
        id: access
        kind: yesno
