name: onboarding

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [onboarding-net]

  # MongoDB: пока только инфраструктура, коллекции и клиенты появятся позже
  mongo:
    image: mongo:8.0.34
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [onboarding-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [onboarding-net]

  # S3-совместимое хранилище (серверная часть MinIO; OpenMaxIO — форк консоли MinIO)
  s3:
    image: ${S3_IMAGE}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [onboarding-net]

  s3-init:
    image: ${S3_IMAGE}
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $${S3_ROOT_USER} $${S3_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    networks: [onboarding-net]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [onboarding-net]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_ANSWERS} --partitions 3 --replication-factor 1
      "
    networks: [onboarding-net]

  # LLM meno-lite-0.1 (Qwen2.5-7B). Профиль llm: обычный `docker compose up` её не запускает,
  # на сервере: `docker compose --profile llm up -d`. Память: см. INFRASTRUCTURE.md.
  ollama:
    image: ollama/ollama:0.40.10
    profiles: [llm]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [onboarding-net]

  ollama-init:
    image: ollama/ollama:0.40.10
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${MENO_MODEL}"]
    networks: [onboarding-net]

  # ML-сервис: API (RAG + фоновая классификация настроения). LLM не обязательна для старта:
  # без неё /v1/ask отвечает 503, бот это обрабатывает.
  ml:
    build: ./ml
    restart: unless-stopped
    environment: &ml-env
      MENO_BASE_URL: http://ollama:11434/v1
      MENO_MODEL: ${MENO_MODEL}
      CHROMA_DIR: /data/chroma
      KB_PATH: /data/knowledge_base.json
      STORE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ROOT_USER}
      S3_SECRET_KEY: ${S3_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_ANSWERS}
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}
      # протокол Xet у huggingface_hub зависал на медленной сети; обычный HTTP скачивает стабильно
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ml_data:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s  # первый старт скачивает модель эмбеддингов (~2.2 ГБ)
    networks: [onboarding-net]

  # Kafka-консьюмер: ответы сотрудников на вопросы HR -> классификация настроения -> статистика в Redis
  ml-mood-consumer:
    build: ./ml
    restart: unless-stopped
    command: ["python", "-m", "app.kafka_consumer"]
    environment: *ml-env
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [onboarding-net]

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ROOT_USER}
      S3_SECRET_KEY: ${S3_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ANSWERS: ${KAFKA_TOPIC_ANSWERS}
      ML_API_URL: http://ml:8000
      ML_TIMEOUT_MS: 90000
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}
    # от ml не зависит: бот работает и без ML, на вопросы отвечает «сервис временно недоступен»
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [onboarding-net]

volumes:
  pg_data:
  redis_data:
  s3_data:
  kafka_data:
  mongo_data:
  ollama_data:
  ml_data:
  hf_cache:

networks:
  onboarding-net:
